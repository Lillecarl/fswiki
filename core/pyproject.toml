[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fswiki-core"
version = "0.1.0"
description = "PostgREST access and path naming, shared by the fswiki clients"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "merge3>=0.0.15"]

# Rendering is optional at the package level and mandatory at the pipeline
# level: nh3 is required to render at all, and a markup backend is required to
# render anything in particular. A deployment that only publishes installs
# neither.
[project.optional-dependencies]
render = ["nh3>=0.2", "markdown-it-py>=3"]

[tool.setuptools.packages.find]
include = ["fswiki_core*"]
