[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fswiki-core"
version = "0.1.0"
description = "PostgREST access and path naming, shared by the fswiki clients"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["fswiki_core*"]
