[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fswiki-cli"
version = "0.1.0"
description = "Publish fswiki drafts"
requires-python = ">=3.11"
dependencies = ["fswiki-core", "anyio>=4.0"]

[project.scripts]
fswiki = "fswiki_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["fswiki_cli*"]
