[pytest]
# The suite lives in test/ and builds its own Postgres + PostgREST; see
# test/conftest.py. Run it through `nix run --file . tests`, which puts initdb,
# postgrest, fswiki and fswiki-mount on PATH.
testpaths = test
addopts = -q --strict-markers
markers =
    mount: needs a live FUSE mount, and so a kernel that will give us one
