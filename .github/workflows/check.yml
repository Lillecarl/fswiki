name: check

on:
  push:
  pull_request:

jobs:
  # The sandboxable half of the suite: render, client, SQL, audit and
  # impersonation over HTTP. 97 tests in about eleven seconds, and it needs
  # nothing of the runner but a working Nix -- Postgres and PostgREST come up
  # on loopback inside the build sandbox, which is where they were measured.
  #
  # The mount half cannot run in here at all -- see the `mount` job below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # default.nix is `import <nixpkgs> {}`, so NIX_PATH is what pins it.
          nix_path: nixpkgs=channel:nixos-unstable

      - run: nix build --file . tests.check -L

      # Each client is a package in its own right, and a suite that passes
      # while `nix build` is broken is a suite nobody can install.
      - run: nix build --file . core cli fuse -L

  # The other half, which needs a real /dev/fuse and so cannot live in a build
  # sandbox. Outside the sandbox it needs three things from the runner:
  # /dev/fuse itself, unprivileged user namespaces, and a /etc/subuid range for
  # --map-auto. The step below reports all three before trying, so a failure
  # here says which one was missing rather than whatever libfuse says about an
  # open() it could not make.
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: What this runner has
        run: |
          ls -l /dev/fuse || echo 'NO /dev/fuse'
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo '(no such sysctl; fine)'
          cat /etc/subuid || echo 'NO /etc/subuid'
          unshare --user --map-root-user id || echo 'NO user namespaces'

      - name: The whole suite, mounts included
        run: |
          runner=$(nix build --file . tests --no-link --print-out-paths)/bin/fswiki-test
          unshare --user --map-auto --map-root-user --mount --propagation private \
            "$runner" -p no:cacheprovider
