name: check

on:
  push:
  pull_request:

# A second push supersedes the first. Nothing here is a deploy, so there is
# nothing a cancelled run leaves half-done.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The sandboxable half of the suite: render, client, the audit queue, SQL,
  # and the audit trail and impersonation over HTTP. 121 tests in about fifteen
  # seconds, and it needs nothing of the runner but a working Nix -- Postgres
  # and PostgREST come up on loopback inside the build sandbox, which is where
  # that was measured.
  #
  # No cachix. There is one (`lillecarl`), and nanopynix uses it because it
  # compiles Nix itself; here the 248 MiB is nixpkgs closure that cache.nixos.org
  # already holds, and the only things built locally are five small derivations
  # measured in seconds. Wiring a token in would buy nothing worth the secret.
  #
  # The mount half cannot run in here at all -- see the `mount` job below.
  check:
    # Pinned rather than ubuntu-latest: `latest` moves under you, and a suite
    # that starts failing because the image rolled is a morning spent looking
    # in the wrong place.
    runs-on: ubuntu-24.04
    # The sandboxed half is fifteen seconds. Anything near this is hung.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # default.nix is `import <nixpkgs> {}`, so NIX_PATH is what pins it.
          nix_path: nixpkgs=channel:nixos-unstable

      - run: nix build --file . tests.check -L

      # Each client is a package in its own right, and a suite that passes
      # while `nix build` is broken is a suite nobody can install.
      - run: nix build --file . core cli fuse -L

  # The other half, which needs a real /dev/fuse and so cannot live in a build
  # sandbox.
  #
  # Not the `unshare --user --map-auto --map-root-user` invocation that works on
  # a workstation. Measured on a runner: /dev/fuse is there and /etc/subuid has
  # a range, but the user namespace never carries CAP_SYS_ADMIN into the mount
  # namespace -- `unshare: cannot change root filesystem propagation:
  # Permission denied`, and a plain --map-root-user cannot even write
  # /proc/self/uid_map. The whole reason for the user namespace locally is to
  # become root without being root; a runner is ephemeral and hands out sudo, so
  # here we simply are.
  #
  # Postgres still refuses to run as root, which the suite already handles: as
  # uid 0 it drops initdb and pg_ctl to uid 1000. That is the same code path the
  # workstation invocation exercises, for the same reason.
  mount:
    runs-on: ubuntu-24.04
    # A cap matters more here than anywhere else: a wedged FUSE mount does not
    # crash, it blocks, and every `ls` after it blocks too. Without this the
    # default is six hours of a runner sitting on a hung syscall.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: What this runner has
        run: |
          ls -l /dev/fuse || echo 'NO /dev/fuse'
          command -v fusermount3 || echo '(no system fusermount3; the nix one is used)'

      - name: The whole suite, mounts included
        run: |
          runner=$(nix build --file . tests --no-link --print-out-paths)/bin/fswiki-test
          # A mount namespace so a suite that dies mid-run leaves nothing behind,
          # and `env PATH` because sudo resets it and the nix profile is on it.
          sudo env "PATH=$PATH" "FSWIKI_ROOT=$PWD" \
            unshare --mount --propagation private \
            "$runner" -p no:cacheprovider
